name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 (API 37) SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: motorway-simulator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
